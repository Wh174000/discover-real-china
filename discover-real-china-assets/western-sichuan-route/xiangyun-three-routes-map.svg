<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">Western Sichuan three route anchor map</title>
  <desc id="desc">An English travel map showing three Western Sichuan route options anchored by Chengdu, Hailuogou, Garze, and Daocheng Yading.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6e8"/>
      <stop offset="0.52" stop-color="#f3ead6"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3b2b18" flood-opacity=".16"/>
    </filter>
    <pattern id="grain" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M12 30h1M62 90h1M104 55h1M148 128h1M32 138h1M132 20h1" stroke="#8a7657" stroke-opacity=".18"/>
    </pattern>
    <style>
      .title{font-family:Georgia, 'Times New Roman', serif;font-size:78px;letter-spacing:.05em;fill:#0f2740}
      .sub{font-family:Arial, sans-serif;font-size:22px;letter-spacing:.22em;fill:#9a5d32;text-transform:uppercase}
      .mono{font-family:Arial, sans-serif;letter-spacing:.14em;text-transform:uppercase}
      .body{font-family:Georgia, 'Times New Roman', serif;fill:#4c453b}
      .node{fill:#fbf6e8;stroke:#b06a3a;stroke-width:5}
      .nodeText{font-family:Arial, sans-serif;font-size:20px;font-weight:700;letter-spacing:.12em;fill:#11263a;text-transform:uppercase}
      .small{font-family:Arial, sans-serif;font-size:15px;letter-spacing:.08em;fill:#655b4f}
      .routeA{fill:none;stroke:#b05f35;stroke-width:7;stroke-linecap:round;stroke-dasharray:2 18}
      .routeB{fill:none;stroke:#1e6e65;stroke-width:7;stroke-linecap:round;stroke-dasharray:16 16}
      .routeC{fill:none;stroke:#11263a;stroke-width:7;stroke-linecap:round}
      .cardTitle{font-family:Arial, sans-serif;font-size:23px;font-weight:800;letter-spacing:.08em;fill:#10263c;text-transform:uppercase}
      .cardMeta{font-family:Arial, sans-serif;font-size:14px;font-weight:700;letter-spacing:.16em;fill:#a25e32;text-transform:uppercase}
      .cardBody{font-family:Georgia, 'Times New Roman', serif;font-size:18px;line-height:1.5;fill:#4f493e}
    </style>
  </defs>

  <rect width="1600" height="950" fill="url(#paper)"/>
  <rect width="1600" height="950" fill="url(#grain)" opacity=".55"/>

  <g opacity=".24" stroke="#9a8b74" stroke-width="1.2" fill="none">
    <path d="M560 110c92 26 143 69 205 38s130-61 222-30 150 18 222-23"/>
    <path d="M520 165c118 34 166 76 238 42s134-60 218-26 161 25 272-22"/>
    <path d="M500 230c114 28 180 83 260 50s140-62 220-34 169 39 292-14"/>
    <path d="M490 292c117 36 196 84 276 48s156-66 238-33 173 35 292-18"/>
    <path d="M500 356c115 32 181 83 259 51s159-69 244-35 175 37 292-14"/>
    <path d="M512 420c106 27 174 72 247 47s155-64 238-31 166 34 272-14"/>
    <path d="M540 488c98 21 165 62 232 42s142-55 221-30 154 31 250-10"/>
  </g>

  <g transform="translate(70 86)">
    <text class="sub" x="0" y="0">Western Sichuan route system</text>
    <text class="title" x="0" y="92">Three journeys,</text>
    <text class="title" x="0" y="178">one cultural arc.</text>
    <text class="body" x="3" y="235" font-size="24">The stay nodes sit quietly behind the journey.</text>
    <text class="body" x="3" y="272" font-size="24">The public story leads with glaciers, hot springs,</text>
    <text class="body" x="3" y="309" font-size="24">Thangka culture, and Tibetan highland life.</text>
  </g>

  <g transform="translate(1010 76)" filter="url(#softShadow)">
    <rect x="0" y="0" width="500" height="162" rx="0" fill="#fffaf0" stroke="#d3c4a7"/>
    <rect x="0" y="0" width="10" height="162" fill="#b05f35"/>
    <text class="cardMeta" x="34" y="42">Route 01 · 3 days</text>
    <text class="cardTitle" x="34" y="78">Glacier Hot Springs</text>
    <text class="cardBody" x="34" y="113">Chengdu to Hailuogou for glacier light,</text>
    <text class="cardBody" x="34" y="140">sacred waters, hot springs, and soft adventure.</text>
  </g>

  <g transform="translate(1010 265)" filter="url(#softShadow)">
    <rect x="0" y="0" width="500" height="178" rx="0" fill="#fffaf0" stroke="#d3c4a7"/>
    <rect x="0" y="0" width="10" height="178" fill="#1e6e65"/>
    <text class="cardMeta" x="34" y="42">Route 02 · 4 days</text>
    <text class="cardTitle" x="34" y="78">Garze Thangka Express</text>
    <text class="cardBody" x="34" y="113">Fly or drive into Garze for Gesar stories,</text>
    <text class="cardBody" x="34" y="140">Thangka ateliers, mineral pigments, and</text>
    <text class="cardBody" x="34" y="167">a calmer highland rhythm.</text>
  </g>

  <g transform="translate(1010 475)" filter="url(#softShadow)">
    <rect x="0" y="0" width="500" height="190" rx="0" fill="#fffaf0" stroke="#d3c4a7"/>
    <rect x="0" y="0" width="10" height="190" fill="#11263a"/>
    <text class="cardMeta" x="34" y="42">Route 03 · 8 days</text>
    <text class="cardTitle" x="34" y="78">Tibetan Highlands Explorer</text>
    <text class="cardBody" x="34" y="113">A deeper arc from Chengdu to Hailuogou,</text>
    <text class="cardBody" x="34" y="140">Garze, and Daocheng Yading, designed for</text>
    <text class="cardBody" x="34" y="167">overseas travelers who want Tibet-like culture</text>
  </g>

  <g transform="translate(110 390)">
    <path class="routeC" d="M80 62 C215 120 273 202 360 246 C455 294 521 358 620 482"/>
    <path class="routeA" d="M80 62 C160 108 218 132 286 168"/>
    <path class="routeB" d="M80 62 C210 108 313 157 360 246"/>

    <circle class="node" cx="80" cy="62" r="21"/>
    <text class="nodeText" x="120" y="56">Chengdu</text>
    <text class="small" x="120" y="82">Gateway city</text>

    <circle class="node" cx="286" cy="168" r="21"/>
    <text class="nodeText" x="326" y="162">Hailuogou</text>
    <text class="small" x="326" y="188">Glacier and hot springs</text>

    <circle class="node" cx="360" cy="246" r="21"/>
    <text class="nodeText" x="400" y="240">Garze</text>
    <text class="small" x="400" y="266">Gesar and Thangka country</text>

    <circle class="node" cx="620" cy="482" r="21"/>
    <text class="nodeText" x="660" y="476">Daocheng Yading</text>
    <text class="small" x="660" y="502">Highland sanctuary</text>

    <g opacity=".20" stroke="#11263a" fill="none" stroke-width="2">
      <path d="M40 520c90-120 160-92 240-180s151-82 218-174 146-92 220-42"/>
      <path d="M8 575c106-138 204-110 298-202s160-93 234-188 160-100 242-53"/>
      <path d="M188 574c84-98 130-88 195-152s104-72 162-122 121-69 192-44"/>
    </g>
  </g>

  <g transform="translate(96 820)">
    <rect x="0" y="-38" width="26" height="8" fill="#b05f35"/>
    <text class="small" x="38" y="-30">Glacier Hot Springs</text>
    <rect x="270" y="-38" width="26" height="8" fill="#1e6e65"/>
    <text class="small" x="308" y="-30">Garze Thangka Express</text>
    <rect x="610" y="-38" width="26" height="8" fill="#11263a"/>
    <text class="small" x="648" y="-30">Tibetan Highlands Explorer</text>
    <text class="body" x="0" y="24" font-size="22">Culture leads. Stays, transport, guides, and local partners support the route behind the scenes.</text>
  </g>
</svg>
