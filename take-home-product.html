<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail | Discover Real China</title>
  <link rel="icon" href="discover-real-china-assets/favicon.svg" type="image/svg+xml">
  <style>
    :root{
      --bg:#f7f7f8;
      --surface:#ffffff;
      --ink:#111111;
      --muted:#666c70;
      --line:rgba(17,17,17,.16);
      --accent:#e4002b;
      --mist:#eceff1;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Aptos","Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .shell{width:min(1360px,calc(100% - 44px));margin:0 auto}
    .top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase}
    .brand{font-weight:800}
    .nav{display:flex;gap:18px;color:var(--muted)}
    .hero{min-height:auto;display:grid;grid-template-columns:minmax(320px,.88fr) minmax(0,1.12fr);gap:18px;padding:18px 0 10px;align-items:start}
    .hero-copy{position:sticky;top:18px;align-self:start;border:1px solid var(--line);background:var(--surface);padding:32px;display:grid;gap:22px;align-content:start}
    .kicker{font-size:11px;text-transform:uppercase;color:var(--accent);font-weight:800}
    h1,h2,h3{font-family:"Aptos","Segoe UI",Arial,sans-serif;font-weight:800;margin:0}
    h1{font-size:66px;line-height:.94;max-width:8.5ch}
    .lead{margin-top:24px;max-width:620px;color:#30383c;font-size:16px;line-height:1.75}
    .hero-actions,.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
    .hero-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .hero-meta article{border:1px solid var(--line);background:var(--bg);padding:12px 14px;display:grid;gap:6px}
    .hero-meta small{font-size:10px;text-transform:uppercase;color:var(--accent)}
    .hero-meta strong{font-size:15px;line-height:1.35}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;background:var(--ink);color:white;font-size:11px;text-transform:uppercase;border:1px solid var(--ink)}
    .btn.secondary{background:transparent;color:var(--ink)}
    .hero-media{display:grid;gap:18px;align-content:start}
    .gallery{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
    .gallery-figure,.gallery-shot,.tile{position:relative;margin:0;border:1px solid var(--line);background:var(--surface);overflow:hidden}
    .gallery-figure{min-height:720px}
    .gallery-figure img,.gallery-shot img{width:100%;height:100%;display:block;object-fit:cover}
    .gallery-figure:after,.gallery-shot:after,.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.5))}
    .gallery-figure span,.gallery-shot span,.tile span{position:absolute;left:22px;right:22px;bottom:20px;z-index:1;color:white;font-size:12px;text-transform:uppercase}
    .gallery-side{display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:18px}
    .gallery-shot{min-height:228px}
    .hero-stack{display:grid;gap:18px}
    .tile{min-height:351px;padding:22px;display:flex;flex-direction:column;justify-content:flex-start}
    .tile .badge{display:inline-flex;align-self:flex-start;border:1px solid var(--line);background:var(--mist);font-size:10px;text-transform:uppercase;padding:6px 8px;margin-bottom:10px}
    .tile strong{position:relative;z-index:1;font-size:28px;line-height:1.05;max-width:10ch}
    .tile p{position:relative;z-index:1;margin:12px 0 0;color:var(--muted);line-height:1.6}
    .tile-list{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px;position:relative;z-index:1}
    .tile-list li{padding:8px 10px;border:1px solid var(--line);background:rgba(17,17,17,.03);font-size:12px;line-height:1.4;color:var(--ink)}
    .section{padding:52px 0 0}
    .section-head{display:grid;grid-template-columns:.7fr 1fr;gap:22px;align-items:end;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:24px 0}
    .section-head h2{font-size:56px;line-height:.96;margin-top:10px}
    .section-head p{color:var(--muted);line-height:1.75;margin:0}
    .details-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
    .detail-card{border:1px solid var(--line);background:var(--surface);padding:22px;min-height:220px;display:grid;align-content:start;gap:10px}
    .detail-card h3{font-size:28px;line-height:1.02}
    .detail-card p{margin:0;color:var(--muted);line-height:1.65;font-size:14px}
    .detail-card small{color:var(--accent);font-size:10px;text-transform:uppercase}
    .matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
    .matrix article{border:1px solid var(--line);background:var(--surface);padding:24px;min-height:250px}
    .matrix h3{font-size:30px;line-height:1.05;margin-top:10px}
    .matrix p{color:var(--muted);line-height:1.65}
    .inquiry{margin:54px 0 44px;display:grid;grid-template-columns:.58fr 1fr;border:1px solid var(--line);background:var(--surface)}
    .inquiry-copy{padding:30px;border-right:1px solid var(--line);background:var(--ink);color:white}
    .inquiry-copy .kicker{color:rgba(255,255,255,.78)}
    .inquiry-copy h2{font-size:46px;line-height:.96;margin-top:10px}
    .inquiry-copy p{color:rgba(255,255,255,.78);line-height:1.7}
    .fields{padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
    label{display:grid;gap:8px;color:var(--ink);font-size:11px;text-transform:uppercase}
    select,textarea,input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:12px;min-height:44px}
    textarea{min-height:118px;resize:vertical}
    .full{grid-column:1/-1}
    .field-note{grid-column:1/-1;color:var(--muted);font-size:13px;line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
    footer{border-top:1px solid var(--line);padding:26px 0 42px;color:var(--muted);font-size:12px;text-transform:uppercase}
    @media(max-width:1080px){
      .hero,.section-head,.inquiry{grid-template-columns:1fr}
      .hero-copy{position:static}
      .gallery{grid-template-columns:1fr}
      .gallery-side{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:none}
      .gallery-figure{min-height:460px}
      .gallery-shot{min-height:180px}
      .details-grid,.matrix{grid-template-columns:1fr 1fr}
      .nav{display:none}
      .inquiry-copy{border-right:0;border-bottom:1px solid var(--line)}
    }
    @media(max-width:640px){
      .shell{width:min(100% - 28px,1360px)}
      h1{font-size:50px}
      .section-head h2{font-size:40px}
      .details-grid,.matrix,.fields{grid-template-columns:1fr}
      .hero-copy,.inquiry-copy{padding:22px}
      .hero-meta{grid-template-columns:1fr}
      .gallery{grid-template-columns:1fr}
      .gallery-side{grid-template-columns:1fr;grid-template-rows:repeat(3,180px)}
      .gallery-figure{min-height:360px}
      .tile{min-height:240px}
      .tile strong{font-size:24px;max-width:12ch}
      .detail-card{min-height:auto}
    }
  </style>

      <article><small>${product.tileTwo[0]}</small><strong>${product.tileTwo[1]}</strong></article>
    `;

    document.title = `${product.title} | Discover Real China`;
    document.getElementById("app").innerHTML = `
      <section class="hero">
        <div class="hero-copy">
          <div>
            <div class="kicker">${product.destination} / ${product.price}</div>
            <h1>${product.title}</h1>
            <p class="lead">${product.summary}</p>
          </div>
          <div class="hero-meta">${heroMetaHtml}</div>
          <div>
            <div class="hero-actions">
              <a class="btn" href="#order">Request checkout link</a>
              <a class="btn secondary" href="take-home.html">Back to shelf</a>
            </div>
          </div>
        </div>
        <div class="hero-media">
          <div class="gallery">
            <figure class="gallery-figure">
              <img src="${mainShot.src}" alt="${mainShot.label} for ${product.title}">
              <span>${mainShot.label}</span>
            </figure>
            <div class="gallery-side">
              ${gallerySideHtml}
            </div>
          </div>
          <div class="hero-stack">
            <div class="tile">
              <div class="badge">${product.tileOne[0]}</div>
              <strong>${product.tileOne[1]}</strong>
              <ul class="tile-list">${tileOneHtml}</ul>
            </div>
            <div class="tile">
              <div class="badge">${product.tileTwo[0]}</div>
              <strong>${product.tileTwo[1]}</strong>
              <ul class="tile-list">${tileTwoHtml}</ul>
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <div><div class="kicker">Product detail</div><h2>See the object, the guide, and the route together.</h2></div>
          <p>See what the product includes, why it belongs to the destination, and what happens after you request checkout.</p>
        </div>
        <div class="details-grid">
          ${bulletsHtml}
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <div><div class="kicker">Why it fits</div><h2>The product is the doorway.</h2></div>
          <p>Each item stands on its own as a gift or kit, with an optional workshop or journey available when you are ready.</p>
        </div>
        <div class="matrix">
          ${fitHtml}
        </div>
      </section>

      <section class="inquiry" id="order">
        <div class="inquiry-copy">
          <div class="kicker">Checkout request</div>
          <h2>Request a checkout link.</h2>
          <p>Tell us the item, quantity, country, and timing. We confirm stock, shipping, included video-guide access when relevant, and payment next step before sending the link.</p>
        </div>
        <form class="fields">
          <label>Selected product
            <select>${optionsHtml}</select>
          </label>
          <label>Quantity
            <input value="1">
          </label>
          <label>Country or region
            <input placeholder="Where should we ship or plan for?">
          </label>
          <label>Preferred timing
            <input placeholder="Example: this month, next month, not sure">
          </label>
          <label class="full">What should we prepare?
            <textarea placeholder="Tell us the edition, quantity, shipping window, or whether you would like to ask about a workshop."></textarea>
          </label>
          <div class="field-note">${noteHtml}<p>Planning a China trip later? Tell us about this purchase and we can discuss a related welcome benefit or experience upgrade with your travel plan.</p></div>
          <div class="full"><button class="btn" type="submit">Prepare checkout request</button></div>
        </form>
      </section>
    `;

    const form = document.querySelector("form");
    const note = document.querySelector(".field-note");
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const selectedSlug = document.querySelector("select").value;
      const selectedProduct = PRODUCTS[selectedSlug] || product;
      const quantity = document.querySelectorAll('input')[0].value || "1";
      const region = document.querySelectorAll('input')[1].value || "not set";
      const timing = document.querySelectorAll('input')[2].value || "not set";
      const requestNote = document.querySelector("textarea").value || "No extra notes yet.";
      const summary = [
        `Product: ${selectedProduct.title}`,
        `Quantity: ${quantity}`,
        `Region: ${region}`,
        `Timing: ${timing}`
      ].join(" | ");
      const subject = encodeURIComponent(`Discover Real China checkout request - ${selectedProduct.title}`);
      const body = [
        "Hello Discover Real China,",
        "",
        "I would like to request a checkout link for this Take Home product:",
        `Product: ${selectedProduct.title}`,
        `Destination: ${selectedProduct.destination}`,
        `Listed price: ${selectedProduct.price}`,
        `Quantity: ${quantity}`,
        `Country or region: ${region}`,
        `Preferred timing: ${timing}`,
        "",
        "Please confirm stock, shipping cost, delivery time, included video-guide access if relevant, and payment next step.",
        "",
        "Future China journey note: I may later plan a trip and would like to discuss how this purchase could connect with a welcome benefit or experience upgrade.",
        "",
        "Notes:",
        requestNote
      ].join("\r\n");
      location.href = `mailto:hello@discoverrealchina.com?subject=${subject}&body=${encodeURIComponent(body)}`;
      note.textContent = `Checkout request prepared. ${summary}`;
    });
  </script>
